name: Artwork upload form diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artwork-form-diagnostic.yml'
      - 'src/artwork-form-diagnostic.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only artwork form diagnostic
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/artwork-form-diagnostic.js
      - name: Persist diagnostic report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/artwork-form-diagnostic-2026-10-07
          git commit -m "Record artwork form diagnostic [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-form-diagnostic
          path: reports/artwork-form-diagnostic-2026-10-07/

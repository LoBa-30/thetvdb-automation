name: Elian E08 safe apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-e08-apply.yml'
      - 'src/elian-e08-apply.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, apply and verify Elian S2026E08
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_ELIAN_E08_APPLY: 'yes'
        run: node src/elian-e08-apply.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-e08-apply
          git commit -m "Record Elian E08 correction results [skip ci]" || true
          git pull --rebase
          git push
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elian-e08-apply
          path: reports/elian-e08-apply/
          retention-days: 30

name: Mcfly main-channel exhaustive audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-final-audit.yml'
      - 'src/mcfly-final-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -U yt-dlp requests beautifulsoup4 pillow imagehash
      - name: Retrieve official main-channel Videos tab only
        run: |
          mkdir -p reports/mcfly-final
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/@LeFatShow/videos' > reports/mcfly-final/catalogue.json
      - name: Run exhaustive comparison
        run: python src/mcfly-final-audit.py
      - name: Persist audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-final
          git commit -m "Update Mcfly main-channel exhaustive audit [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-main-channel-exhaustive-audit
          path: reports/mcfly-final/
          retention-days: 30

name: Elian thumbnail probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-thumbnail-probe.yml'
      - 'src/elian-thumbnail-probe.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node src/elian-thumbnail-probe.js
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-thumbnail-probe
          git commit -m "Record Elian thumbnail probe [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: elian-thumbnail-probe
          path: reports/elian-thumbnail-probe/

name: Mcfly GROSSE ANNONCE insertion preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-grosse-annonce-preflight.yml'
      - 'src/mcfly-grosse-annonce-preflight.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded zero-write preflight
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mcfly-grosse-annonce-preflight.js
      - name: Persist preflight report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-grosse-annonce-preflight
          git commit -m "Record GROSSE ANNONCE insertion preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-grosse-annonce-preflight
          path: reports/mcfly-grosse-annonce-preflight/

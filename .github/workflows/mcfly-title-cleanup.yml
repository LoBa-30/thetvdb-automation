name: Mcfly substantive title cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-title-cleanup.yml'
      - 'src/mcfly-title-cleanup.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, repair titles, verify
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_TITLE_APPLY: 'yes'
        run: node src/mcfly-title-cleanup.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-title-cleanup
          git commit -m "Record Mcfly title cleanup [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-title-cleanup
          path: reports/mcfly-title-cleanup/
          retention-days: 30

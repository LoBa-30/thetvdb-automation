name: Mastu 2017 E31 date repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-2017-e31-date-repair.yml'
      - 'src/mastu-2017-e31-date-repair.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, repair date, verify
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MASTU_2017_E31_DATE_APPLY: 'yes'
        run: node src/mastu-2017-e31-date-repair.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-2017-e31-date-repair
          git commit -m "Record Mastu 2017 E31 date repair [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-2017-e31-date-repair
          path: reports/mastu-2017-e31-date-repair/
          retention-days: 30

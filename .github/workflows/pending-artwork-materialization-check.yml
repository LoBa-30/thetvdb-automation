name: Pending artwork materialization read-only check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pending-artwork-materialization-check.yml'
      - 'src/pending-artwork-materialization-check.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read-only pending artwork and title-drift verification
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/pending-artwork-materialization-check.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pending-artwork-materialization-2026-10-07
          git commit -m "Record pending artwork materialization check [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-artwork-materialization-check
          path: reports/pending-artwork-materialization-2026-10-07/

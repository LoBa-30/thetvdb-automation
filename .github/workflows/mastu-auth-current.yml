name: Mastu authenticated current-state check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-auth-current.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only batch resolution
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: npm run batch:resolve
      - name: Upload read-only state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastu-auth-current-state
          path: reports/batch-resolution.*
          retention-days: 30

name: Elian E08 current title refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-e08-title-refresh.yml'
      - 'src/elian-e08-title-refresh.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded title refresh
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_ELIAN_E08_TITLE_APPLY: yes
        run: node src/elian-e08-title-refresh.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-e08-title-refresh
          git commit -m "Record Elian E08 title refresh [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-e08-title-refresh
          path: reports/elian-e08-title-refresh/

name: Mcfly & Carlito auth lite preflight
on:
  push:
    branches: [mcfly-audit-2026-10-03]
    paths:
      - '.github/workflows/mcfly-auth-lite.yml'
      - 'src/mcfly-auth-lite.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read authenticated current values without writes
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mcfly-auth-lite.js
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-auth-lite
          git commit -m "Record Mcfly auth lite preflight [skip ci]" || exit 0
          git pull --rebase
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-auth-lite-preflight
          path: reports/mcfly-auth-lite/
          retention-days: 30

name: Mcfly guarded runtime corrections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-runtime-apply.yml'
      - 'src/mcfly-runtime-apply.js'
      - 'config/mcfly-runtime-corrections-2026-10-06.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, correct runtimes, verify
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_RUNTIME_APPLY: 'yes'
        run: node src/mcfly-runtime-apply.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-runtime-apply
          git commit -m "Record Mcfly runtime corrections [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-runtime-corrections
          path: reports/mcfly-runtime-apply/
          retention-days: 30

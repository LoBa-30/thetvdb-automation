name: Elian series profile preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-series-profile-preflight.yml'
      - 'src/elian-series-profile-preflight.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yt-dlp
      - name: Run Elian series profile preflight
        run: python src/elian-series-profile-preflight.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-series-profile-preflight-2026-10-07
          git commit -m "Record Elian series profile preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-series-profile-preflight
          path: reports/elian-series-profile-preflight-2026-10-07/

name: Artwork user-192 selected frames — V23.2 source preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artwork-user192-source-preflight-v23-2.yml'
      - 'src/artwork-user192-source-preflight-v23-2.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tvdb-user192-source-images-readonly-v23-2
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-analysis libraries
        run: python -m pip install Pillow numpy
      - name: Confirm 192 user-selected image URLs, dimensions and pixel uniqueness without uploading
        run: python src/artwork-user192-source-preflight-v23-2.py
      - name: Commit read-only report
        if: always()
        run: |
          if [ -f reports/artwork-user192-source-preflight-v23-2/report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/artwork-user192-source-preflight-v23-2/
            git commit -m "Record user192 source image preflight [skip ci]" || true
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-user192-source-preflight
          path: reports/artwork-user192-source-preflight-v23-2/
          retention-days: 30

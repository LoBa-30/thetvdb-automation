name: Joyca YouTube publication dates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-youtube-dates.yml'

permissions:
  contents: read

jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp requests
      - name: Retrieve catalogue and dates through YouTube player API
        run: |
          mkdir -p reports/joyca-youtube-dates
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/c/JOYCA-JORDAN/videos' > reports/joyca-youtube-dates/catalogue.json
          python - <<'PY'
          import json,re,requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import Counter
          cat=json.load(open('reports/joyca-youtube-dates/catalogue.json',encoding='utf-8'))
          entries=cat.get('entries') or []
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.8'}
          home=requests.get('https://www.youtube.com/?hl=fr&gl=FR',headers=H,timeout=20).text
          def grab(pattern,default=None):
              m=re.search(pattern,home)
              return m.group(1) if m else default
          key=grab(r'"INNERTUBE_API_KEY":"([^"]+)"')
          ver=grab(r'"INNERTUBE_CONTEXT_CLIENT_VERSION":"([^"]+)"') or grab(r'"clientVersion":"([^"]+)"')
          print('key?',bool(key),'version',ver)
          if not key: raise SystemExit('INNERTUBE_API_KEY not found')
          client_version=ver or '2.20261001.00.00'
          url='https://www.youtube.com/youtubei/v1/player?key='+key
          def one(e):
              vid=e.get('id')
              row={'id':vid,'title':e.get('title'),'duration':e.get('duration'),'publish_date':None,'upload_date':None,'status':None}
              try:
                  payload={'context':{'client':{'clientName':'WEB','clientVersion':client_version,'hl':'fr','gl':'FR'}},'videoId':vid,'contentCheckOk':True,'racyCheckOk':True}
                  r=requests.post(url,headers={**H,'Content-Type':'application/json'},json=payload,timeout=15)
                  row['status']=r.status_code
                  d=r.json()
                  micro=((d.get('microformat') or {}).get('playerMicroformatRenderer') or {})
                  row['publish_date']=micro.get('publishDate')
                  row['upload_date']=micro.get('uploadDate')
                  row['api_title']=((d.get('videoDetails') or {}).get('title'))
                  row['playability_status']=((d.get('playabilityStatus') or {}).get('status'))
              except Exception as ex:
                  row['error']=str(ex)
              return row
          out=[None]*len(entries)
          with ThreadPoolExecutor(max_workers=24) as ex:
              futs={ex.submit(one,e):i for i,e in enumerate(entries)}
              done=0
              for fut in as_completed(futs):
                  out[futs[fut]]=fut.result();done+=1
                  if done%50==0: print('done',done,'dates',sum(1 for x in out if x and x.get('publish_date')))
          json.dump(out,open('reports/joyca-youtube-dates/dates.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          summary={'entries':len(out),'with_publish_date':sum(1 for x in out if x.get('publish_date')),'without_publish_date':sum(1 for x in out if not x.get('publish_date')),'with_upload_date':sum(1 for x in out if x.get('upload_date')),'status_counts':dict(Counter(str(x.get('status')) for x in out)),'playability':dict(Counter(str(x.get('playability_status')) for x in out))}
          json.dump(summary,open('reports/joyca-youtube-dates/summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joyca-youtube-publication-dates
          path: reports/joyca-youtube-dates/
          retention-days: 30

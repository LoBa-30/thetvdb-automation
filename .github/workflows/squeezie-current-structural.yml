name: Squeezie current structural inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-current-structural.yml'
      - 'src/squeezie-current-structural-inventory.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node src/squeezie-current-structural-inventory.js
      - name: Persist compact report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-current-structural
          git commit -m "Record Squeezie current structural inventory [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeezie-current-structural
          path: reports/squeezie-current-structural/

name: Amixem read Unassigned

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-unassigned.yml'
      - 'src/amixem-unassigned.js'

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read Amixem Unassigned
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/amixem-unassigned.js
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-unassigned
          git commit -m "Update Amixem Unassigned snapshot [skip ci]" || exit 0
          git pull --rebase
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amixem-unassigned
          path: reports/amixem-unassigned/
          retention-days: 30

name: TheTVDB V24 original-video source availability (metadata only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artwork-v24-source-video-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp
      - run: python src/artwork-v24-source-video-readonly-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-v24-public-video-metadata-no-uploads
          path: reports/artwork-v24-source-video-readonly-probe/
          retention-days: 14

name: Mastu BLUFF V22.3 guarded add after primary verification
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tvdb-mastu-bluff-v22-3-single-create
  cancel-in-progress: false
jobs:
  guarded-add:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node --check src/mastu-bluff-v22-3-guarded-apply.js
      - name: Official RSS identity/date, corroborated public runtime, fresh collision checks, guarded write and postcheck
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MASTU_BLUFF_V22_APPLY: 'yes'
        run: node src/mastu-bluff-v22-3-guarded-apply.js
      - name: Save checkpoint even if blocked
        if: always()
        run: |
          if [ -f reports/mastu-bluff-v22-3-apply/report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/mastu-bluff-v22-3-apply
            git commit -m "Report guarded Mastu BLUFF S2026E16 attempt [skip ci]" || true
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-bluff-v22-3-guarded-apply
          path: reports/mastu-bluff-v22-3-apply/
          retention-days: 30

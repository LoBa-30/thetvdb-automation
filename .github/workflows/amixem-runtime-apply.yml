name: Amixem safe runtime apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-runtime-apply.yml'
      - 'src/amixem-runtime-apply.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Apply safe runtime corrections
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_AMIXEM_RUNTIME_APPLY: "yes"
        run: node src/amixem-runtime-apply.js
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-runtime-apply
          git commit -m "Record Amixem runtime correction results [skip ci]" || exit 0
          git pull --rebase
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amixem-runtime-apply-report
          path: reports/amixem-runtime-apply/
          retention-days: 30

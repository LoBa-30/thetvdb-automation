name: TheTVDB artwork restriction notifications
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tvdb-artwork-restriction-notifications.yml'
      - 'src/tvdb-artwork-restriction-notifications.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read-only notification audit
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/tvdb-artwork-restriction-notifications.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/tvdb-artwork-restriction-notifications-2026-10-07
          git commit -m "Record TheTVDB artwork restriction notifications [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvdb-artwork-restriction-notifications
          path: reports/tvdb-artwork-restriction-notifications-2026-10-07/

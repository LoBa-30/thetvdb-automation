name: Mcfly GROSSE ANNONCE artwork delayed verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-grosse-annonce-artwork-delayed-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read-only delayed artwork verification
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mcfly-grosse-annonce-artwork-delayed-verify.js
      - name: Persist verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-grosse-annonce-artwork-delayed-verify
          git commit -m "Record delayed GROSSE ANNONCE artwork verification [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-grosse-annonce-artwork-delayed-verify
          path: reports/mcfly-grosse-annonce-artwork-delayed-verify/

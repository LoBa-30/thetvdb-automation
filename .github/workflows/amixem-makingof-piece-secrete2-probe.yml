name: Amixem making-of provenance probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-makingof-piece-secrete2-probe.yml'
      - 'src/amixem-makingof-piece-secrete2-probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - run: python src/amixem-makingof-piece-secrete2-probe.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-makingof-piece-secrete2-probe
          git commit -m "Record Amixem making-of provenance [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amixem-makingof-piece-secrete2-probe
          path: reports/amixem-makingof-piece-secrete2-probe/
          retention-days: 30

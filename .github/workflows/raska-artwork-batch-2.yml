name: Raska artwork batch 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raska-artwork-batch-2.yml'
      - 'src/raska-artwork-batch-2.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Raska artwork batch 2
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_RASKA_ARTWORK_BATCH: 'yes'
        run: node src/raska-artwork-batch-2.js
      - name: Persist batch report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/raska-artwork-batch-2-2026-10-07
          git commit -m "Record Raska artwork batch 2 [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raska-artwork-batch-2
          path: reports/raska-artwork-batch-2-2026-10-07/

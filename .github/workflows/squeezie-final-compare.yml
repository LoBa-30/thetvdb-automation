name: Squeezie consolidated metadata audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-final-compare.yml'
      - 'src/squeezie-final-compare.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Compare consolidated YouTube metadata to current TheTVDB
        run: node src/squeezie-final-compare.js
      - name: Commit final comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-final
          git commit -m "Update consolidated Squeezie metadata audit [skip ci]" || exit 0
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeezie-final-metadata-audit
          path: reports/squeezie-final/
          retention-days: 30

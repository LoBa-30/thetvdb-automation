name: Artwork V23.2 upload form restriction diagnostic (no writes)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artwork-user192-form-restriction-diagnostic-v23-2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node --check src/artwork-user192-form-restriction-diagnostic-v23-2.js
      - name: Inspect authenticated artwork add form without submitting
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/artwork-user192-form-restriction-diagnostic-v23-2.js
      - name: Preserve diagnostic
        if: always()
        run: |
          if [ -f reports/artwork-user192-form-restriction-v23-2/report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/artwork-user192-form-restriction-v23-2/
            git commit -m "Record user192 artwork upload form read-only diagnosis [skip ci]" || true
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-user192-form-diagnostic
          path: reports/artwork-user192-form-restriction-v23-2/

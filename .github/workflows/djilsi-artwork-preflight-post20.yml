name: Djilsi artwork post20 preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/djilsi-artwork-preflight-post20.yml'
      - 'src/djilsi-artwork-preflight-post20-2026-10-07.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp requests beautifulsoup4 pillow
      - name: Read-only Djilsi post20 artwork preflight
        run: python src/djilsi-artwork-preflight-post20-2026-10-07.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/djilsi-artwork-preflight-post20-2026-10-07
          git commit -m "Record Djilsi post20 artwork preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: djilsi-artwork-preflight-post20
          path: reports/djilsi-artwork-preflight-post20-2026-10-07/

name: Squeezie deep audit

on:
  push:
    branches: [main]
    paths:
      - 'src/squeezie-deep-audit.js'
      - '.github/workflows/squeezie-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Collect official YouTube Videos tab
        run: |
          mkdir -p reports/squeezie-deep
          yt-dlp --flat-playlist --dump-json --ignore-errors "https://www.youtube.com/@Squeezie/videos" > reports/squeezie-deep/youtube-flat.ndjson
          wc -l reports/squeezie-deep/youtube-flat.ndjson
      - name: Run deep Squeezie audit
        run: node src/squeezie-deep-audit.js
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-deep
          git commit -m "Update Squeezie deep audit report [skip ci]" || exit 0
          git push
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squeezie-deep-audit
          path: reports/squeezie-deep/
          if-no-files-found: warn
          retention-days: 30

name: Maxime artwork gap fill 1
on:
  push:
    branches: [main]
    paths:
      - 'triggers/maxime-artwork-gap-fill-1.run'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Maxime artwork gap fill 1
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MAXIME_ARTWORK_GAP_FILL: 'yes'
        run: node src/maxime-artwork-gap-fill-1.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-artwork-gap-fill-1-2026-10-07
          git commit -m "Record Maxime artwork gap fill 1 [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-artwork-gap-fill-1
          path: reports/maxime-artwork-gap-fill-1-2026-10-07/

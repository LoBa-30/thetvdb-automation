name: TheTVDB read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static check exhaustive 9-channel audit
        run: node --check src/matcher.js && node --check src/audit.js && node --check src/audit-all.js && node --check src/plan.js

      - name: Test exact-first matcher regressions
        run: npm test

      - name: Run exhaustive read-only audit for all 9 channels
        run: npm run audit:all

      - name: Build correction plan from exhaustive audit
        run: npm run plan

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thetvdb-audit-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

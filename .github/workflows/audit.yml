name: TheTVDB read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only audit and build correction plan
        run: npm run audit:plan

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thetvdb-audit-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

name: Mastu exact duplicate safe apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-duplicate-safe-apply.yml'
      - 'src/mastu-duplicate-safe-apply.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Apply exact duplicate merges
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mastu-duplicate-safe-apply.js
      - name: Persist apply report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-unassigned-duplicate-apply
          git commit -m "Record Mastu exact duplicate apply results [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-exact-duplicate-apply
          path: reports/mastu-unassigned-duplicate-apply/

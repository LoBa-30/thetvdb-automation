name: Mcfly & Carlito authenticated current-state snapshot

on:
  push:
    branches: [mcfly-audit-2026-10-03]
    paths:
      - '.github/workflows/mcfly-auth-snapshot.yml'
      - 'src/mcfly-auth-snapshot.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only snapshot
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mcfly-auth-snapshot.js
      - name: Commit snapshot report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-auth-snapshot
          git commit -m "Update Mcfly authenticated snapshot [skip ci]" || exit 0
          git push
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-authenticated-current-state
          path: reports/mcfly-auth-snapshot/
          retention-days: 30

name: Mastu historical exact-ID probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-historical-exact-id-probe.yml'
      - 'src/mastu-historical-exact-id-probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - run: python src/mastu-historical-exact-id-probe.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-historical-exact-id-probe
          git commit -m "Record Mastu historical exact-ID probe [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-historical-exact-id-probe
          path: reports/mastu-historical-exact-id-probe/
          retention-days: 30

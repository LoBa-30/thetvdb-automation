name: Mcfly final two runtime fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-runtime-final2.yml'
      - 'src/mcfly-runtime-final2.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, fix two runtimes, verify
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_RUNTIME_FINAL2_APPLY: 'yes'
        run: node src/mcfly-runtime-final2.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-runtime-final2
          git commit -m "Record final Mcfly runtime fixes [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-final-two-runtime-fixes
          path: reports/mcfly-runtime-final2/
          retention-days: 30

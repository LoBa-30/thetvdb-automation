name: Elian artwork recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-artwork-recovery.yml'
      - 'src/elian-artwork-recovery.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Elian artwork recovery
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_ELIAN_ARTWORK_RECOVERY: 'yes'
        run: node src/elian-artwork-recovery.js
      - name: Persist recovery report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-artwork-recovery-2026-10-07
          git commit -m "Record Elian artwork recovery [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-artwork-recovery
          path: reports/elian-artwork-recovery-2026-10-07/

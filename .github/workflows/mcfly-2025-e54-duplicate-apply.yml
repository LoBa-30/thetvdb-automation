name: Mcfly 2025 E54 duplicate repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-2025-e54-duplicate-apply.yml'
      - 'src/mcfly-2025-e54-duplicate-apply.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh duplicate preflight and single guarded apply
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_2025_DUPLICATE_APPLY: 'yes'
        run: node src/mcfly-2025-e54-duplicate-apply.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-2025-e54-duplicate-apply
          git commit -m "Record Mcfly 2025 E54 duplicate repair [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-2025-e54-duplicate-apply
          path: reports/mcfly-2025-e54-duplicate-apply/

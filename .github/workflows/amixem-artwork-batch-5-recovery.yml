name: Amixem artwork batch 5 recovery
on:
  push:
    branches: [main]
    paths:
      - 'triggers/amixem-artwork-batch-5-recovery.run'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Amixem artwork batch 5 recovery
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_AMIXEM_ARTWORK_BATCH: 'yes'
        run: node src/amixem-artwork-batch-5-recovery.js
      - name: Persist batch report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-artwork-batch-5-recovery-2026-10-07
          git commit -m "Record Amixem artwork batch 5 recovery [skip ci]" || true
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amixem-artwork-batch-5-recovery
          path: reports/amixem-artwork-batch-5-recovery-2026-10-07/

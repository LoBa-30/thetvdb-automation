name: Elian artwork form inspection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-artwork-form-inspection.yml'
      - 'src/elian-artwork-form-inspection.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect artwork form read-only
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/elian-artwork-form-inspection.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-artwork-form-inspection
          git commit -m "Record Elian artwork form inspection [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-artwork-form-inspection
          path: reports/elian-artwork-form-inspection/

name: Mcfly Unassigned exact-duplicate preflight

on:
  workflow_dispatch:
  push:
    branches: [mcfly-audit-2026-10-03]
    paths:
      - '.github/workflows/mcfly-unassigned-duplicate-preflight.yml'
      - 'src/mcfly-unassigned-duplicate-preflight.js'
      - 'config/mcfly-unassigned-exact-duplicates.json'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh authenticated read-only duplicate preflight
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mcfly-unassigned-duplicate-preflight.js
      - name: Persist preflight report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-unassigned-duplicate-preflight
          git commit -m "Record Mcfly duplicate preflight [skip ci]" || true
          git pull --rebase
          git push
      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-unassigned-duplicate-preflight
          path: reports/mcfly-unassigned-duplicate-preflight/
          retention-days: 30

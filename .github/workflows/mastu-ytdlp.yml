name: Mastu full YouTube catalogue verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-ytdlp.yml'

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Retrieve Mastu Videos tab
        run: |
          mkdir -p reports/mastu-ytdlp
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/channel/UCAhaFPP6v3WCfK5Tjao0B7A/videos' > reports/mastu-ytdlp/catalogue.json
          python - <<'PY'
          import json
          p='reports/mastu-ytdlp/catalogue.json'
          d=json.load(open(p, encoding='utf-8'))
          entries=d.get('entries') or []
          print('Mastu entries:', len(entries))
          with open('reports/mastu-ytdlp/summary.txt','w',encoding='utf-8') as f:
              f.write(f'Mastu YouTube Videos tab via yt-dlp: {len(entries)}\n')
              for e in entries[:5]: f.write(f"NEWEST | {e.get('id')} | {e.get('title')}\n")
              for e in entries[-5:]: f.write(f"OLDEST | {e.get('id')} | {e.get('title')}\n")
          PY
      - name: Upload catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastu-ytdlp-catalogue-fr
          path: reports/mastu-ytdlp/
          retention-days: 30

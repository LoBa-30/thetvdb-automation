name: Amixem parallel exact metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-ytdlp-parallel.yml'
      - 'src/amixem-ytdlp-parallel.py'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - name: Fetch exact metadata in parallel
        run: python src/amixem-ytdlp-parallel.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-ytdlp-parallel
          git commit -m "Update Amixem parallel exact metadata [skip ci]" || exit 0
          git pull --rebase
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amixem-parallel-exact-metadata
          path: reports/amixem-ytdlp-parallel/
          retention-days: 30

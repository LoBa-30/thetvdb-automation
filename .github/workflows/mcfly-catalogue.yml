name: Mcfly flat catalogue snapshot
on:
  push:
    branches: [mcfly-audit-2026-10-03]
    paths:
      - '.github/workflows/mcfly-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -U yt-dlp
      - name: Collect current Videos-tab catalogue
        run: |
          mkdir -p reports/mcfly-catalogue
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/c/LeFatShow/videos' > reports/mcfly-catalogue/catalogue.json
      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-catalogue/catalogue.json
          git commit -m "Record Mcfly flat catalogue [skip ci]" || exit 0
          git pull --rebase
          git push

name: Joyca 2026 runtime audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-2026-runtime-audit.yml'
      - 'src/joyca-2026-runtime-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp requests beautifulsoup4
      - name: Retrieve official Joyca Videos tab
        run: |
          mkdir -p reports/joyca-2026-runtime-audit
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/c/JOYCA-JORDAN/videos' > reports/joyca-2026-runtime-audit/catalogue.json
      - name: Compare 2026 runtimes
        run: python src/joyca-2026-runtime-audit.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/joyca-2026-runtime-audit
          git commit -m "Record Joyca 2026 runtime audit [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joyca-2026-runtime-audit
          path: reports/joyca-2026-runtime-audit/
          retention-days: 30

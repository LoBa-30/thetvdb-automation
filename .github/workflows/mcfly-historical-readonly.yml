name: Mcfly historical read-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-historical-readonly.yml'
      - 'src/mcfly-historical-readonly.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node src/mcfly-historical-readonly.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-historical-readonly
          git commit -m "Record Mcfly historical read-only audit [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-historical-readonly
          path: reports/mcfly-historical-readonly/

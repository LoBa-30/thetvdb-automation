name: Amixem historical TVDB details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-historical-tvdb-details.yml'
      - 'src/amixem-historical-tvdb-details.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node src/amixem-historical-tvdb-details.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amixem-historical-tvdb-details
          path: reports/amixem-historical-tvdb-details/
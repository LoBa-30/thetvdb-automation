name: Amixem targeted structural metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-targeted.yml'
      - 'src/amixem-targeted-metadata.py'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - name: Verify targeted videos
        run: python src/amixem-targeted-metadata.py
      - name: Commit targeted report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-targeted
          git commit -m "Update Amixem targeted metadata [skip ci]" || exit 0
          git pull --rebase
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amixem-targeted-metadata
          path: reports/amixem-targeted/
          retention-days: 30

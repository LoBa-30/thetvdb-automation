name: Squeezie artwork preflight 2026-10-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-artwork-preflight-2026-10-07.yml'
      - 'src/squeezie-artwork-preflight-2026-10-07.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read-only Squeezie artwork preflight
        run: node src/squeezie-artwork-preflight-2026-10-07.js
      - name: Persist preflight report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-artwork-preflight-2026-10-07
          git commit -m "Record Squeezie artwork preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeezie-artwork-preflight
          path: reports/squeezie-artwork-preflight-2026-10-07/

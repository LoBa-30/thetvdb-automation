name: Mcfly Maradon date safe apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-maradon-date-apply.yml'
      - 'src/mcfly-maradon-date-apply.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, apply and verify Mcfly Maradon date
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_MARADON_DATE_APPLY: 'yes'
        run: node src/mcfly-maradon-date-apply.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-maradon-date-apply
          git commit -m "Record Mcfly Maradon date correction results [skip ci]" || true
          git pull --rebase
          git push
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-maradon-date-apply
          path: reports/mcfly-maradon-date-apply/
          retention-days: 30

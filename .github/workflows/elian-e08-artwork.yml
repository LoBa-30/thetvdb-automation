name: Elian S2026E08 artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-e08-artwork.yml'
      - 'src/elian-e08-artwork.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Elian S2026E08 artwork
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_ELIAN_E08_ARTWORK: 'yes'
        run: node src/elian-e08-artwork.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-e08-artwork-2026-10-07
          git commit -m "Record Elian S2026E08 artwork [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-e08-artwork
          path: reports/elian-e08-artwork-2026-10-07/

name: Joyca historical YouTube verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-historical.yml'
      - 'src/joyca-historical-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - name: Search historical videos on official Joyca YouTube
        run: python src/joyca-historical-audit.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/joyca-historical
          git commit -m "Record Joyca historical verification [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joyca-historical-youtube-verification
          path: reports/joyca-historical/

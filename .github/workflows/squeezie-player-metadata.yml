name: Squeezie exact YouTube player metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-player-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect exact metadata from YouTube player API
        run: python src/squeezie-youtube-player.py
      - name: Commit exact player metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-deep/youtube-player-metadata.ndjson reports/squeezie-deep/youtube-player-summary.json
          git commit -m "Update Squeezie exact YouTube player metadata [skip ci]" || exit 0
          git pull --rebase
          git push
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squeezie-player-metadata
          path: reports/squeezie-deep/youtube-player-*
          retention-days: 30

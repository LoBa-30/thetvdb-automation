name: Raska YouTube metadata audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raska-ytdlp.yml'

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Retrieve Raska Videos metadata
        run: |
          mkdir -p reports/raska-ytdlp
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/@R4SK4/videos' > reports/raska-ytdlp/catalogue.json
          python - <<'PY'
          import json
          p='reports/raska-ytdlp/catalogue.json'
          d=json.load(open(p, encoding='utf-8'))
          entries=d.get('entries') or []
          out=[]
          for e in entries:
              out.append({
                  'id': e.get('id'),
                  'title': e.get('title'),
                  'url': e.get('url') or e.get('webpage_url'),
                  'duration': e.get('duration'),
                  'timestamp': e.get('timestamp'),
                  'upload_date': e.get('upload_date'),
                  'release_timestamp': e.get('release_timestamp'),
                  'thumbnail': e.get('thumbnail'),
                  'availability': e.get('availability'),
                  'live_status': e.get('live_status'),
              })
          json.dump(out, open('reports/raska-ytdlp/metadata.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          with open('reports/raska-ytdlp/summary.txt','w',encoding='utf-8') as f:
              f.write(f'Raska YouTube Videos tab via yt-dlp: {len(entries)}\n')
              f.write(f'With duration: {sum(x.get("duration") is not None for x in out)}\n')
              f.write(f'With timestamp/upload_date: {sum((x.get("timestamp") is not None or x.get("upload_date")) for x in out)}\n')
          print(open('reports/raska-ytdlp/summary.txt',encoding='utf-8').read())
          PY
      - name: Upload catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raska-ytdlp-metadata-fr
          path: reports/raska-ytdlp/
          retention-days: 30

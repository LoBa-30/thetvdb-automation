name: Maxime S2019E01 artwork restore
on:
  push:
    branches: [main]
    paths:
      - 'triggers/maxime-s2019e01-restore.run'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Maxime S2019E01 restore
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MAXIME_S2019E01_RESTORE: 'yes'
        run: node src/maxime-s2019e01-restore.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-s2019e01-restore-2026-10-07
          git commit -m "Record Maxime S2019E01 artwork restore [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-s2019e01-restore
          path: reports/maxime-s2019e01-restore-2026-10-07/

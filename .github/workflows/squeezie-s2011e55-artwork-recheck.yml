name: Squeezie S2011E55 artwork recheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-s2011e55-artwork-recheck.yml'
      - 'src/squeezie-s2011e55-artwork-recheck.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read-only Squeezie S2011E55 artwork recheck
        run: node src/squeezie-s2011e55-artwork-recheck.js
      - name: Persist recheck report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-s2011e55-artwork-recheck-2026-10-07
          git commit -m "Record Squeezie E55 artwork recheck [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeezie-s2011e55-artwork-recheck
          path: reports/squeezie-s2011e55-artwork-recheck-2026-10-07/

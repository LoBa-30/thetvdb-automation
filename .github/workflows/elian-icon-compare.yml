name: Elian icon compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-icon-compare.yml'
      - 'src/elian-icon-compare.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Compare Elian TVDB icon with official YouTube avatar
        run: python src/elian-icon-compare.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-icon-compare-2026-10-07
          git commit -m "Record Elian icon comparison [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-icon-compare
          path: reports/elian-icon-compare-2026-10-07/

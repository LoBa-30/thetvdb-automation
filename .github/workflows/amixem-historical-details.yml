name: Amixem historical TVDB details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-historical-details.yml'
      - 'src/amixem-historical-details.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node src/amixem-historical-details.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-historical-details
          git commit -m "Record Amixem historical TVDB details [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amixem-historical-details
          path: reports/amixem-historical-details/

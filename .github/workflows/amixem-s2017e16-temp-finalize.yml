name: Amixem S2017E16 temp finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-s2017e16-temp-finalize.yml'
      - 'src/amixem-s2017e16-temp-finalize.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Finalize existing temp artwork without reupload
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_AMIXEM_TEMP_FINALIZE: 'yes'
        run: node src/amixem-s2017e16-temp-finalize.js
      - name: Persist recovery report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-s2017e16-temp-finalize-2026-10-07
          git commit -m "Record Amixem S2017E16 temp finalize [skip ci]" || true
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amixem-s2017e16-temp-finalize
          path: reports/amixem-s2017e16-temp-finalize-2026-10-07/

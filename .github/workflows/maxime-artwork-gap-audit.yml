name: Maxime artwork gap audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-artwork-gap-audit.yml'
      - 'src/maxime-artwork-gap-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow beautifulsoup4 yt-dlp
      - name: Run read-only Maxime artwork gap audit
        run: python src/maxime-artwork-gap-audit.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-artwork-gap-audit-2026-10-07
          git commit -m "Record Maxime artwork gap audit [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-artwork-gap-audit
          path: reports/maxime-artwork-gap-audit-2026-10-07/

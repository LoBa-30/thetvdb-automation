name: Maxime two edge artworks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-two-edge-artworks.yml'
      - 'src/maxime-two-edge-artworks.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Probe remaining Maxime artwork edge cases
        run: python src/maxime-two-edge-artworks.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-two-edge-artworks-2026-10-07
          git commit -m "Record Maxime edge artwork probes [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-two-edge-artworks
          path: reports/maxime-two-edge-artworks-2026-10-07/

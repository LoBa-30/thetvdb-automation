name: Mcfly GROSSE ANNONCE artwork apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-grosse-annonce-artwork-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Single guarded artwork upload
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_GROSSE_ANNONCE_ARTWORK_APPLY: "yes"
        run: node src/mcfly-grosse-annonce-artwork-apply.js
      - name: Persist artwork apply report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-grosse-annonce-artwork-apply
          git commit -m "Record GROSSE ANNONCE artwork apply [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcfly-grosse-annonce-artwork-apply
          path: reports/mcfly-grosse-annonce-artwork-apply/

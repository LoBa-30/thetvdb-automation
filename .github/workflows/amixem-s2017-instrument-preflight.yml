name: Amixem S2017 instrument structural preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amixem-s2017-instrument-preflight.yml'
      - 'src/amixem-s2017-instrument-preflight.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only structural preflight
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/amixem-s2017-instrument-preflight.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/amixem-s2017-instrument-preflight
          git commit -m "Record Amixem S2017 instrument preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amixem-s2017-instrument-preflight
          path: reports/amixem-s2017-instrument-preflight/

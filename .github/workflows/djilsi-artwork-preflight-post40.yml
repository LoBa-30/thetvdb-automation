name: Djilsi artwork post40 preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/djilsi-artwork-preflight-post40.yml'
      - 'src/djilsi-artwork-preflight-post40-2026-10-07.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow beautifulsoup4 yt-dlp
      - name: Run preflight
        run: python src/djilsi-artwork-preflight-post40-2026-10-07.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/djilsi-artwork-preflight-post40-2026-10-07
          git commit -m "Record Djilsi artwork post40 preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: djilsi-artwork-preflight-post40
          path: reports/djilsi-artwork-preflight-post40-2026-10-07/

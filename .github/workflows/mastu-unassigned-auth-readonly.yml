name: Mastu authenticated Unassigned read-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-unassigned-auth-readonly.yml'
      - 'src/mastu-unassigned-auth-readonly.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only Unassigned audit
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mastu-unassigned-auth-readonly.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-unassigned-auth
          git commit -m "Record Mastu authenticated Unassigned audit [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-unassigned-auth-readonly
          path: reports/mastu-unassigned-auth/

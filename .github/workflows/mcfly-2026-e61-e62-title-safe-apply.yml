name: Mcfly 2026 E61 E62 guarded French title repair (NO ARTWORK)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcfly-2026-e61-e62-title-safe-apply.yml'
permissions:
  contents: write
concurrency:
  group: mcfly-two-2026-episode-title-one-shot
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate targeted structural metadata script
        run: node --check src/mcfly-2026-e61-e62-title-safe-apply.js
      - name: Install browser dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Guarded exact-ID French title repairs and independent postchecks
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MCFLY_2026_TITLE_FIX: 'yes'
        run: node src/mcfly-2026-e61-e62-title-safe-apply.js
      - name: Preserve targeted result on GitHub without re-triggering writes
        if: always()
        run: |
          if [ -f reports/mcfly-2026-e61-e62-title-repair/report.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/mcfly-2026-e61-e62-title-repair/report.json
            git commit -m 'Record guarded 2026 Mcfly title repair result [skip ci]' || true
            git pull --rebase
            git push
          fi
      - name: Store preflight and postcheck artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-2026-e61-e62-title-repair
          path: reports/mcfly-2026-e61-e62-title-repair/
          retention-days: 30

name: Joyca final exhaustive audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-final-audit.yml'
      - 'src/joyca-final-audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -U yt-dlp requests beautifulsoup4 pillow imagehash
      - name: Retrieve official Joyca Videos tab
        run: |
          mkdir -p reports/joyca-final
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/c/JOYCA-JORDAN/videos' > reports/joyca-final/catalogue.json
      - name: Run exhaustive comparison
        run: python src/joyca-final-audit.py
      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joyca-final-exhaustive-audit
          path: reports/joyca-final/
          retention-days: 30

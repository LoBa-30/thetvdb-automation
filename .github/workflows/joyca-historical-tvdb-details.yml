name: Joyca historical TVDB details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-historical-tvdb-details.yml'
      - 'src/joyca-historical-tvdb-details.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U requests beautifulsoup4
      - run: python src/joyca-historical-tvdb-details.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/joyca-historical-tvdb-details
          git commit -m "Record Joyca historical TVDB details [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joyca-historical-tvdb-details
          path: reports/joyca-historical-tvdb-details/

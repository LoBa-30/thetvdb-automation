name: Artwork V23 exact and near duplicate scan (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artwork-exact-duplicates-v23.yml'
      - 'src/artwork-exact-duplicates-v23.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artworks-v23-readonly
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image analysis libraries
        run: python -m pip install pillow numpy
      - name: Compare actual artwork content (no edits)
        run: python src/artwork-exact-duplicates-v23.py
      - name: Save findings
        if: always()
        run: |
          if [ -f reports/artwork-exact-duplicates-v23/report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/artwork-exact-duplicates-v23/
            git commit -m "Record V23 image-content duplicate scan [skip ci]" || true
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-v23-pixel-duplicates
          path: reports/artwork-exact-duplicates-v23/

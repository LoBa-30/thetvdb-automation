name: Maxime season boundary audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-season-boundary-audit.yml'
      - 'src/maxime-season-boundary-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U requests beautifulsoup4
      - run: |
          mkdir -p reports/maxime-season-boundary-audit
          python src/maxime-season-boundary-audit.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-season-boundary-audit
          git commit -m "Record Maxime season boundary audit [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-season-boundary-audit
          path: reports/maxime-season-boundary-audit/
          retention-days: 30

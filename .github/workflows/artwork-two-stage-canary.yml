name: Artwork two-stage canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artwork-two-stage-canary.yml'
      - 'src/artwork-two-stage-canary.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded two-stage artwork canary
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_ARTWORK_CROP_CANARY: 'yes'
        run: node src/artwork-two-stage-canary.js
      - name: Persist canary report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/artwork-two-stage-canary-2026-10-07
          git commit -m "Record two-stage artwork canary [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-two-stage-canary
          path: reports/artwork-two-stage-canary-2026-10-07/

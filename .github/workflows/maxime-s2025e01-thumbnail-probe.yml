name: Maxime S2025E01 thumbnail probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-s2025e01-thumbnail-probe.yml'
      - 'src/maxime-s2025e01-thumbnail-probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python src/maxime-s2025e01-thumbnail-probe.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-s2025e01-thumbnail-probe-2026-10-07
          git commit -m "Record Maxime S2025E01 thumbnail probe [skip ci]" || true
          git pull --rebase
          git push

      - name: Upload frame candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxime-s2025e01-frame-candidates
          path: reports/maxime-s2025e01-thumbnail-probe-2026-10-07/

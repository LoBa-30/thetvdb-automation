name: Joyca artwork batch 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-artwork-batch-1.yml'
      - 'src/joyca-artwork-batch-1.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Joyca artwork batch 1
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_JOYCA_ARTWORK_BATCH: 'yes'
        run: node src/joyca-artwork-batch-1.js
      - name: Persist batch report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/joyca-artwork-batch-1-2026-10-07
          git commit -m "Record Joyca artwork batch 1 [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joyca-artwork-batch-1
          path: reports/joyca-artwork-batch-1-2026-10-07/

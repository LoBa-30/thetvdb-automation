name: TheTVDB structural V26 planner guard (OFFLINE, NO ARTWORK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/structural-planner-v26-offline-guard.yml'
      - 'src/plan.js'
      - 'src/structural-audit-artifact-guard.mjs'
      - 'src/planner-verified-video-id.js'
      - 'structural-tests/planner-verified-video-id.test.js'
      - 'reports/structural-mastu-verified-identity-v26.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: tvdb-structural-planner-v26-only
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax and regression tests, no authenticated requests
        run: |
          node --check src/plan.js
          node --check src/structural-audit-artifact-guard.mjs
          node --check src/planner-verified-video-id.js
          node --test structural-tests/planner-verified-video-id.test.js
          node --test tests/planner-duplicate-resolution.test.js
      - name: Select latest successful main-branch audit
        id: audit_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/audit.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[0] | {id, head_branch, conclusion, created_at}')"
          id="$(jq -r '.id // empty' <<< "$info")"
          branch="$(jq -r '.head_branch // empty' <<< "$info")"
          status="$(jq -r '.conclusion // empty' <<< "$info")"
          created="$(jq -r '.created_at // empty' <<< "$info")"
          [[ "$id" =~ ^[0-9]+$ && "$branch" == main && "$status" == success ]] || exit 1
          epoch="$(date -u -d "$created" +%s)" || exit 1
          now="$(date -u +%s)"
          (( now >= epoch && now - epoch <= 259200 )) || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
      - name: Download audit in isolated directory
        uses: actions/download-artifact@v4
        with:
          name: thetvdb-audit-report
          run-id: ${{ steps.audit_source.outputs.id }}
          github-token: ${{ github.token }}
          path: .audit-source/
      - name: Validate audit and stage only audit.json
        env:
          RUN_CREATED: ${{ steps.audit_source.outputs.created }}
        run: node src/structural-audit-artifact-guard.mjs .audit-source reports/audit.json "$RUN_CREATED"
      - name: Recompute plan only; do not access TheTVDB
        run: node src/plan.js
      - name: Assert exact outcomes from V26 and locked non-destructive scope
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p=JSON.parse(fs.readFileSync('reports/correction-plan.json'));
            const mastu=p.targets.find(t=>t.name==='Mastu');
            const resolved=(mastu?.resolvedByCheckpoint||[]).filter(x=>x.resolution?.decision==='RESOLVED_EXISTING_DISTINCT_EPISODE_NO_WRITE');
            const official=(mastu?.resolvedByCheckpoint||[]).filter(x=>x.resolution?.decision==='RESOLVED_TVDB_OFFICIAL_WEBSITE_LINK_MATCH_NO_WRITE');
            if(p.summary.reviewRequired<0 || p.summary.informational<0 || p.summary.resolvedByCheckpoint!==7 ||
               p.summary.autoEligible!==0 || resolved.length!==2 || official.length!==2 || p.mode!=='PLAN_ONLY_NO_TVDB_WRITES_RESOLUTION_AWARE')
              throw Error('V26 planner reconciliation drift: '+JSON.stringify(p.summary));
            console.log('STRUCTURAL_V26_OFFLINE_PLAN_PASS '+JSON.stringify(p.summary));
          "
      - name: Store plan-only checks and unresolved structural tickets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thetvdb-structural-v26-planner-offline
          path: |
            reports/correction-plan.json
            reports/correction-plan.txt
          retention-days: 30

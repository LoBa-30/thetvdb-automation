name: Squeezie S2011E55 artwork recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-artwork-e55-recovery.yml'
      - 'src/squeezie-artwork-e55-recovery.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded Squeezie S2011E55 artwork recovery
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_SQUEEZIE_ARTWORK_BATCH: 'yes'
        run: node src/squeezie-artwork-e55-recovery.js
      - name: Persist recovery report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-artwork-e55-recovery-2026-10-07
          git commit -m "Record Squeezie E55 artwork recovery [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeezie-artwork-e55-recovery
          path: reports/squeezie-artwork-e55-recovery-2026-10-07/

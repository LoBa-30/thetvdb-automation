name: Mastu duplicate deletion preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-duplicate-delete-preflight.yml'
      - 'src/mastu-duplicate-delete-preflight.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only duplicate preflight
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mastu-duplicate-delete-preflight.js
      - name: Persist preflight
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-unassigned-duplicate-preflight
          git commit -m "Record Mastu duplicate deletion preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-duplicate-delete-preflight
          path: reports/mastu-unassigned-duplicate-preflight/

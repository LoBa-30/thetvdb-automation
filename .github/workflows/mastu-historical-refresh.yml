name: Mastu historical refresh read-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-historical-refresh.yml'
      - 'src/mastu-historical-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - name: Search historical videos on official Mastu YouTube
        run: python src/mastu-historical-audit.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-historical
          git commit -m "Record Mastu historical refresh [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-historical-refresh
          path: reports/mastu-historical/

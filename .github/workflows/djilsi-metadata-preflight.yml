name: Djilsi metadata preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/djilsi-metadata-preflight.yml'
      - 'src/djilsi-metadata-preflight.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Read-only preflight
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/djilsi-metadata-preflight.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: djilsi-metadata-preflight
          path: reports/djilsi-metadata-preflight/

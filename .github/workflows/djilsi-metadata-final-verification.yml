name: Djilsi metadata final verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/djilsi-metadata-final-verification.yml'
      - 'src/djilsi-metadata-final-verification.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Strict read-only post-apply verification
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/djilsi-metadata-final-verification.js
      - name: Persist verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/djilsi-metadata-final-verification
          git commit -m "Record Djilsi final metadata verification [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: djilsi-metadata-final-verification
          path: reports/djilsi-metadata-final-verification/

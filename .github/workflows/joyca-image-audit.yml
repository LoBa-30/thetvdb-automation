name: Joyca episode image provenance audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joyca-image-audit.yml'

permissions:
  contents: read

jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -U yt-dlp requests beautifulsoup4 pillow imagehash
      - name: Retrieve Joyca flat catalogue
        run: |
          mkdir -p reports/joyca-images
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/c/JOYCA-JORDAN/videos' > reports/joyca-images/catalogue.json
      - name: Audit metadata and image provenance
        run: |
          cat > /tmp/audit_images.py <<'PY'
          import json, re, io, unicodedata
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          import imagehash
          from difflib import SequenceMatcher
          from collections import Counter
          from datetime import datetime

          REF='20260909'
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36'})

          def norm(s):
              s=unicodedata.normalize('NFKD',s or '')
              s=''.join(c for c in s if not unicodedata.combining(c)).lower()
              s=re.sub(r'https?://\\S+',' ',s)
              s=re.sub(r'@[\\w.-]+',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              s=re.sub(r'\\b(ft|feat|avec|youtube|officiel|official|le|la|les|un|une|des|de|du|et)\\b',' ',s)
              s=re.sub(r'\\s+',' ',s).strip()
              return s

          def sim(a,b):
              return SequenceMatcher(None,norm(a),norm(b)).ratio()

          def fmt_duration(sec):
              if sec is None: return None
              sec=int(round(sec)); h,rem=divmod(sec,3600); m,s=divmod(rem,60)
              return f'{h}:{m:02d}:{s:02d}' if h else f'{m}:{s:02d}'

          cat=json.load(open('reports/joyca-images/catalogue.json',encoding='utf-8'))
          # YouTube tab is newest->oldest. Reverse to oldest->newest for sequence alignment.
          videos=[{
              'id':e.get('id'),'title':e.get('title'),
              'duration':e.get('duration'),'duration_text':fmt_duration(e.get('duration'))
          } for e in (cat.get('entries') or []) if e.get('id') and e.get('title')]
          videos=list(reversed(videos))

          episodes=[]
          for y in range(2016,2027):
              url=f'https://thetvdb.com/series/335805-show/seasons/official/{y}'
              rr=S.get(url,timeout=30); rr.raise_for_status()
              soup=BeautifulSoup(rr.text,'html.parser')
              seen=set()
              for a in soup.select('a[href*="/series/335805-show/episodes/"]'):
                  href=a.get('href') or ''
                  m=re.search(r'/episodes/(\\d+)',href)
                  if not m or m.group(1) in seen: continue
                  seen.add(m.group(1))
                  episodes.append({
                    'season_hint':y,'episode_id':m.group(1),
                    'url':'https://thetvdb.com'+href if href.startswith('/') else href
                  })

          rows=[]
          for idx,e in enumerate(episodes,1):
              row={'episode_id':e['episode_id'],'url':e['url'],'season_hint':e['season_hint']}
              try:
                  rr=S.get(e['url'],timeout=30); rr.raise_for_status()
                  soup=BeautifulSoup(rr.text,'html.parser')
                  text='\\n'.join(x.strip() for x in soup.stripped_strings)
                  mt=re.search(r'Season\\s+(\\d{4})\\s*/\\s*Episode\\s+(\\d+)',text,re.I)
                  season=int(mt.group(1)) if mt else e['season_hint']
                  epnum=int(mt.group(2)) if mt else None
                  code=f'S{season}E{epnum:02d}' if epnum is not None else ''
                  h1=soup.find('h1')
                  title=' '.join(h1.get_text(' ',strip=True).split()) if h1 else None
                  dm=re.search(r'Originally Aired\\s+([A-Z][a-z]+ \\d{1,2}, \\d{4})',text,re.I)
                  date_iso=datetime.strptime(dm.group(1),'%B %d, %Y').strftime('%Y%m%d') if dm else None
                  rm=re.search(r'Runtime\\s+(\\d+)\\s+minutes?',text,re.I)
                  runtime=int(rm.group(1)) if rm else None

                  img=None
                  for tag in soup.find_all(['a','img']):
                      val=tag.get('href') if tag.name=='a' else tag.get('src')
                      if not val: continue
                      if 'artworks.thetvdb.com' in val and (e['episode_id'] in val or '/episode' in val.lower()):
                          img=val; break
                  if not img:
                      for tag in soup.find_all('img'):
                          val=tag.get('src') or ''
                          if 'artworks.thetvdb.com/banners/episodes/' in val:
                              img=val; break

                  row.update({
                    'season':season,'episode':epnum,'code':code,'tvdb_title':title,
                    'tvdb_date':date_iso,'tvdb_runtime_minutes':runtime,'tvdb_image':img,
                    'after_reference_date':bool(date_iso and date_iso>REF),
                    'non_main_candidate':bool(title and re.search(r'\\b(instrumental|lyrics video|playlist du mois|trailer|teaser|bande.?annonce|annonce video|annonce vidéo)\\b',title,re.I))
                  })
              except Exception as ex:
                  row['error']=str(ex)
              rows.append(row)
              if idx%25==0: print('parsed TVDB',idx,'/',len(episodes))

          rows.sort(key=lambda r:(r.get('season',9999),r.get('episode') or 9999))

          # Order-constrained alignment: all public YouTube videos are aligned to a subsequence
          # of TheTVDB. The 470-449 = 21 extra TVDB entries become historical/no-current-public-video gaps.
          n,m=len(rows),len(videos)
          NEG=-10**9
          dp=[[NEG]*(m+1) for _ in range(n+1)]
          prev=[[None]*(m+1) for _ in range(n+1)]
          dp[0][0]=0.0
          for i in range(n):
              for j in range(m+1):
                  cur=dp[i][j]
                  if cur<=NEG/2: continue
                  # Skip a TVDB entry.
                  if cur>dp[i+1][j]:
                      dp[i+1][j]=cur
                      prev[i+1][j]=(i,j,'skip')
                  # Match next YouTube video to this TVDB entry.
                  if j<m:
                      score=sim(rows[i].get('tvdb_title'),videos[j].get('title'))
                      val=cur+score
                      if val>dp[i+1][j+1]:
                          dp[i+1][j+1]=val
                          prev[i+1][j+1]=(i,j,'match')

          # Backtrack.
          i,j=n,m
          matched_pairs=[]
          skipped=[]
          while i>0 or j>0:
              p=prev[i][j]
              if p is None: break
              pi,pj,act=p
              if act=='match':
                  matched_pairs.append((pi,pj))
              else:
                  skipped.append(pi)
              i,j=pi,pj
          matched_pairs.reverse(); skipped=set(skipped)
          pair_by_tv={ti:yj for ti,yj in matched_pairs}

          out=[]
          for ti,row in enumerate(rows):
              row=dict(row)
              yj=pair_by_tv.get(ti)
              if yj is None:
                  row.update({
                    'youtube_id':None,'youtube_title':None,'youtube_duration_seconds':None,
                    'youtube_duration':None,'title_similarity':None,'title_exact':False,
                    'runtime_delta_seconds':None,'runtime_major_mismatch':False,
                    'image_provenance':'MISSING_IMAGE' if not row.get('tvdb_image') else 'PRESENT_NO_CURRENT_PUBLIC_YOUTUBE_MATCH'
                  })
                  out.append(row); continue

              v=videos[yj]
              score=sim(row.get('tvdb_title'),v.get('title'))
              row.update({
                'youtube_id':v['id'],'youtube_title':v['title'],
                'youtube_duration_seconds':v.get('duration'),'youtube_duration':v.get('duration_text'),
                'title_similarity':round(score,3),'title_exact':row.get('tvdb_title')==v.get('title'),
                'runtime_delta_seconds':abs(row['tvdb_runtime_minutes']*60-v['duration']) if row.get('tvdb_runtime_minutes') is not None and v.get('duration') is not None else None,
                'runtime_major_mismatch':bool(row.get('tvdb_runtime_minutes') is not None and v.get('duration') is not None and abs(row['tvdb_runtime_minutes']*60-v['duration'])>=60)
              })

              img=row.get('tvdb_image')
              if img:
                  try:
                      b=S.get(img,timeout=30).content
                      tv=Image.open(io.BytesIO(b)).convert('RGB')
                      ph_tv=imagehash.phash(tv)
                      bestdist=None; used=None
                      for yu in [f"https://i.ytimg.com/vi/{v['id']}/maxresdefault.jpg",f"https://i.ytimg.com/vi/{v['id']}/hqdefault.jpg"]:
                          try:
                              r2=S.get(yu,timeout=30)
                              if r2.status_code!=200 or len(r2.content)<1000: continue
                              yi=Image.open(io.BytesIO(r2.content)).convert('RGB')
                              dist=ph_tv-imagehash.phash(yi)
                              if bestdist is None or dist<bestdist: bestdist=dist; used=yu
                          except Exception:
                              pass
                      row['thumbnail_phash_distance']=int(bestdist) if bestdist is not None else None
                      row['compared_youtube_thumbnail']=used
                      row['image_provenance']='CONFIRMED_OFFICIAL_THUMBNAIL' if bestdist is not None and bestdist<=4 else 'PRESENT_ORIGIN_UNCONFIRMED_NEEDS_VIDEO_FRAME_CHECK'
                  except Exception as ex:
                      row['image_provenance']='IMAGE_COMPARE_ERROR'; row['image_error']=str(ex)
              else:
                  row['image_provenance']='MISSING_IMAGE'
              out.append(row)

          json.dump(out,open('reports/joyca-images/audit.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)

          relevant=[r for r in out if not r.get('after_reference_date')]
          c=Counter(r.get('image_provenance','ERROR') for r in relevant)
          summary={
            'reference_date':'2026-09-09',
            'youtube_public_videos_current_total':len(videos),
            'tvdb_episode_pages_current_total':len(out),
            'relevant_tvdb_episodes_through_reference':len(relevant),
            'matched_to_current_public_youtube_through_reference':sum(1 for r in relevant if r.get('youtube_id')),
            'tvdb_without_current_public_youtube_through_reference':sum(1 for r in relevant if not r.get('youtube_id')),
            'exact_title_mismatches':sum(1 for r in relevant if r.get('youtube_id') and not r.get('title_exact')),
            'runtime_major_mismatches':sum(1 for r in relevant if r.get('runtime_major_mismatch')),
            'non_main_candidates':sum(1 for r in relevant if r.get('non_main_candidate')),
            'image_provenance_counts':dict(c)
          }
          json.dump(summary,open('reports/joyca-images/summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          with open('reports/joyca-images/summary.txt','w',encoding='utf-8') as f:
              for k,v in summary.items(): f.write(f'{k}: {v}\\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/audit_images.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joyca-image-provenance-audit
          path: reports/joyca-images/
          retention-days: 30

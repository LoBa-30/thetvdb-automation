name: Mastu artwork provenance v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-artwork-v3.yml'
      - 'src/mastu-artwork-frame-audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp requests beautifulsoup4 pillow imagehash
      - name: Build current V2 source report
        run: |
          mkdir -p reports/mastu-final-v2
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/channel/UCAhaFPP6v3WCfK5Tjao0B7A/videos' > reports/mastu-final-v2/catalogue.json
          python src/mastu-final-audit-v2.py
      - name: Compare unproven artworks to official YouTube generated frames
        run: python src/mastu-artwork-frame-audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastu-artwork-provenance-v3
          path: reports/mastu-artwork-v3/
          retention-days: 30

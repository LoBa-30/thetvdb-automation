name: Squeezie full YouTube metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-ytdlp-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Collect every public long-form video metadata
        run: |
          mkdir -p reports/squeezie-deep
          yt-dlp --skip-download --ignore-errors --no-warnings --dump-json "https://www.youtube.com/@Squeezie/videos" > reports/squeezie-deep/youtube-full.ndjson
          wc -l reports/squeezie-deep/youtube-full.ndjson
      - name: Re-run deep audit using exact video metadata
        run: node src/squeezie-deep-audit.js
      - name: Commit exact metadata and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-deep
          git commit -m "Update Squeezie full YouTube metadata audit [skip ci]" || exit 0
          git push
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squeezie-full-youtube-metadata
          path: reports/squeezie-deep/
          if-no-files-found: warn
          retention-days: 30

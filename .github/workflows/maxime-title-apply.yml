name: Maxime Biaggi safe title apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-title-apply.yml'
      - 'src/maxime-title-apply.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fresh preflight, apply and verify Maxime title corrections
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MAXIME_TITLE_APPLY: 'yes'
        run: node src/maxime-title-apply.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-title-apply
          git commit -m "Record Maxime title correction results [skip ci]" || true
          git pull --rebase
          git push
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxime-title-apply
          path: reports/maxime-title-apply/
          retention-days: 30

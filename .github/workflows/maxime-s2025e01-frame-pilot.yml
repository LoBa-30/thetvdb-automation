name: Maxime S2025E01 frame pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-s2025e01-frame-pilot.yml'
      - 'src/maxime-s2025e01-frame-pilot.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Capture read-only clean frame candidates
        run: node src/maxime-s2025e01-frame-pilot.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-s2025e01-frame-pilot-2026-10-07
          git commit -m "Record Maxime S2025E01 frame pilot [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-s2025e01-frame-pilot
          path: reports/maxime-s2025e01-frame-pilot-2026-10-07/

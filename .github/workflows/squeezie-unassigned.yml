name: Squeezie unassigned episode audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-unassigned.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect authenticated unassigned entries without editing
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/squeezie-unassigned.js
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-deep/unassigned.json
          git commit -m "Update Squeezie unassigned audit [skip ci]" || exit 0
          git pull --rebase
          git push
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squeezie-unassigned
          path: reports/squeezie-deep/unassigned.json
          retention-days: 30

name: Mastu final exhaustive audit v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-final-audit-v2.yml'
      - 'src/mastu-final-audit-v2.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -U yt-dlp requests beautifulsoup4 pillow imagehash
      - name: Retrieve official Mastu Videos tab
        run: |
          mkdir -p reports/mastu-final-v2
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/channel/UCAhaFPP6v3WCfK5Tjao0B7A/videos' > reports/mastu-final-v2/catalogue.json
      - name: Run exhaustive comparison v2
        run: python src/mastu-final-audit-v2.py
      - name: Upload final audit v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastu-final-exhaustive-audit-v2
          path: reports/mastu-final-v2/
          retention-days: 30

name: Maxime remaining artwork serial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-artwork-remaining.yml'
      - 'src/maxime-artwork-remaining.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Serial guarded Maxime remaining artworks
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_MAXIME_ARTWORK_REMAINING: 'yes'
        run: node src/maxime-artwork-remaining.js
      - name: Persist batch report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-artwork-remaining-2026-10-07
          git commit -m "Record Maxime remaining artwork batch [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-artwork-remaining
          path: reports/maxime-artwork-remaining-2026-10-07/

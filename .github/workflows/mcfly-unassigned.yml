name: Mcfly & Carlito Unassigned snapshot
on:
  push:
    branches: [mcfly-audit-2026-10-03]
    paths:
      - '.github/workflows/mcfly-unassigned.yml'
      - 'src/mcfly-unassigned-snapshot.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Extract authenticated Unassigned rows
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mcfly-unassigned-snapshot.js
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mcfly-unassigned
          git commit -m "Record Mcfly Unassigned snapshot [skip ci]" || exit 0
          git pull --rebase
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-unassigned-snapshot
          path: reports/mcfly-unassigned/
          retention-days: 30

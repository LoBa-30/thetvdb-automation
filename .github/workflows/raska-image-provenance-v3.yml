name: Raska screencap provenance v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raska-image-provenance-v3.yml'
      - 'src/raska-image-provenance-v3.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U requests pillow imagehash numpy scikit-image
      - run: python src/raska-image-provenance-v3.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/raska-images-v3
          git commit -m "Record strict Raska screencap provenance [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raska-screencap-provenance-v3
          path: reports/raska-images-v3/
          retention-days: 30

name: Maxime final two-gap auth check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxime-two-gap-auth-check.yml'
      - 'src/maxime-two-gap-auth-check.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Check Maxime final two gaps
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/maxime-two-gap-auth-check.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/maxime-two-gap-auth-check-2026-10-07
          git commit -m "Record Maxime final two-gap check [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxime-two-gap-auth-check
          path: reports/maxime-two-gap-auth-check-2026-10-07/

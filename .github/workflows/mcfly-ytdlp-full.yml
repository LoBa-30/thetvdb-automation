name: Mcfly & Carlito full YouTube metadata
on:
  push:
    branches: [mcfly-audit-2026-10-03]
    paths:
      - '.github/workflows/mcfly-ytdlp-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Collect full metadata for every public Videos-tab upload
        run: |
          mkdir -p reports/mcfly-ytdlp-full
          yt-dlp --skip-download --ignore-errors --no-warnings --dump-json --extractor-args 'youtube:lang=fr' 'https://www.youtube.com/c/LeFatShow/videos' > reports/mcfly-ytdlp-full/youtube-full.ndjson
          wc -l reports/mcfly-ytdlp-full/youtube-full.ndjson | tee reports/mcfly-ytdlp-full/count.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcfly-full-youtube-metadata
          path: reports/mcfly-ytdlp-full/
          retention-days: 30

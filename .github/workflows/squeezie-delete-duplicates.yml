name: Squeezie apply certain duplicate deletions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/squeezie-delete-duplicates.yml'
      - 'src/squeezie-delete-duplicates.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Delete five certain duplicate unassigned episodes
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/squeezie-delete-duplicates.js
      - name: Commit verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/squeezie-deep/delete-apply.json
          git commit -m "Record Squeezie duplicate deletion verification [skip ci]" || exit 0
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeezie-duplicate-deletion
          path: reports/squeezie-deep/delete-apply.json
          if-no-files-found: warn
          retention-days: 30

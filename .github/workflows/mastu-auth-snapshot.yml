name: Mastu authenticated current snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-auth-snapshot.yml'
      - 'src/mastu-auth-snapshot.js'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Authenticated read-only snapshot
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
        run: node src/mastu-auth-snapshot.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastu-auth-current-snapshot
          path: reports/mastu-auth-snapshot/
          retention-days: 30

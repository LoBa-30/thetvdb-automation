name: Elian artwork file canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elian-artwork-file-canary.yml'
      - 'src/elian-artwork-file-canary.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guarded single artwork file upload
        env:
          TVDB_USERNAME: ${{ secrets.TVDB_USERNAME }}
          TVDB_PASSWORD: ${{ secrets.TVDB_PASSWORD }}
          TVDB_ELIAN_ARTWORK_FILE_CANARY: 'yes'
        run: node src/elian-artwork-file-canary.js
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/elian-artwork-file-canary
          git commit -m "Record Elian artwork file canary [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elian-artwork-file-canary
          path: reports/elian-artwork-file-canary/

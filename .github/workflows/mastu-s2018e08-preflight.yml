name: Mastu S2018E08 metadata preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mastu-s2018e08-preflight.yml'
      - 'src/mastu-s2018e08-preflight.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U requests beautifulsoup4
      - run: python src/mastu-s2018e08-preflight.py
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mastu-s2018e08-preflight
          git commit -m "Record Mastu S2018E08 metadata preflight [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastu-s2018e08-preflight
          path: reports/mastu-s2018e08-preflight/
